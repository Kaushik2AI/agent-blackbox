[project]
name = "blackbox-sdk"
version = "0.3.0"
description = "Agent BlackBox SDK: OpenTelemetry-compatible spans/events for agent runs, with redaction and idempotent export"
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1"]

[project.optional-dependencies]
harness = ["agent-harness"]
dev = ["pytest==9.1.1", "ruff==0.17.0", "mypy==2.4.0"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["blackbox_sdk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607"]

[tool.mypy]
python_version = "3.11"
strict = true
# Editable installs are invisible to mypy; point it at the harness sources directly.
mypy_path = "../agent_harness"

[tool.ruff.lint.isort]
known-first-party = ["blackbox_sdk"]
known-third-party = ["agent_harness"]
