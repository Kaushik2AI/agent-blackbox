name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  ENVIRONMENT: test
  DATABASE_URL: postgresql+psycopg://blackbox:ci-password@127.0.0.1:5432/blackbox
  REDIS_URL: redis://127.0.0.1:6379/0
  API_INTERNAL_URL: http://127.0.0.1:8000
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blackbox
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: blackbox
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U blackbox" --health-interval 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: |
          python -m pip install -e "apps/api[dev]" -e "packages/agent_harness[dev]" -e "packages/blackbox_sdk[dev]" -e "packages/analysis_engine[dev]"
          cd apps/web && npm ci --no-audit --no-fund

      - name: Lint and typecheck
        run: make lint

      - name: Demo agent tests (fixtures, verifiers, determinism, no-network)
        run: make test-harness

      - name: Demo agent baselines (10 repeats)
        run: make demo

      - name: SDK tests (span tree, redaction, exporters)
        run: make test-sdk

      - name: Detector tests + labelled evaluation (precision/recall)
        run: make test-analysis && make eval-detectors

      - name: API tests (unit + integration against real Postgres/Redis)
        run: make test-api

      - name: Web unit tests
        run: make test-web

      - name: Web production build
        run: make build-web

      - name: Start stack, seed real runs, live smoke + browser tests
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
        run: |
          cd apps/api && python -m alembic upgrade head
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          python -m rq.cli worker --url "$REDIS_URL" blackbox-default &
          cd ../web && npx next start --hostname 127.0.0.1 --port 3000 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/backend/healthz && break; sleep 1; done
          cd "$GITHUB_WORKSPACE"
          WEB_PORT=3000 make test-web-smoke
          cd apps/web && npx playwright install --with-deps chromium && cd "$GITHUB_WORKSPACE"
          WEB_PORT=3000 make test-e2e
